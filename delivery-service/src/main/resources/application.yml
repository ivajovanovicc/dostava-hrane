spring:
  application:
    name: delivery-service

  datasource:
    url: jdbc:h2:mem:deliverydb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

  h2:
    console:
      enabled: true

  # NOVO: podesavanja za konekciju ka RabbitMQ-u. Ove vrednosti se slucajno
  # poklapaju sa Spring Boot-ovim PODRAZUMEVANIM vrednostima (localhost:5672,
  # guest/guest) - tehnicki ne bi morale da se pisu, ali ih pisemo eksplicitno
  # da je jasno odakle dolaze i lako se menjaju kasnije (npr. za Docker Compose).
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 8084
  error:
    include-message: always
    include-binding-errors: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    hostname: localhost   # TODO (Docker Compose faza): ukloniti
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
