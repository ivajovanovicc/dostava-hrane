spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users/**

            - id: restaurant-service
              uri: lb://restaurant-service
              predicates:
                - Path=/api/restaurants/**,/api/menu-items/**

            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/orders/**

            - id: delivery-service
              uri: lb://delivery-service
              predicates:
                - Path=/api/couriers/**,/api/deliveries/**

            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/notifications/**

server:
  port: 8090   # 8080 je na ovom racunaru rezervisan od strane Windows-a

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
