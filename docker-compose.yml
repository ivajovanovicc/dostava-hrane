# docker-compose.yml - podize CEO sistem (8 aplikacija + RabbitMQ) jednom
# komandom: docker compose up --build
#
# KLJUCNA IDEJA za razumevanje ovog fajla: environment varijable ispod
# ("environment:" sekcije) PREPISUJU vrednosti iz application.yml svakog
# servisa - ne moramo da BRISEMO nista iz application.yml fajlova! Spring
# Boot uvek daje prednost environment varijablama nad onim sto pise u yml
# fajlu. Zato "eureka.client.service-url.defaultZone: http://localhost:8761/eureka"
# iz svakog application.yml OSTAJE tacan default za lokalni razvoj kroz
# IntelliJ, dok Docker Compose ispod postavlja DRUGACIJU vrednost (imena
# kontejnera umesto localhost) SAMO kad se pokrece ovako, kroz Docker.
#
# I bas ovo resava sve one "iki.mshome.net" probleme koje smo lovile ranije -
# Docker sam automatski razresava imena servisa (npr. "eureka-server") u
# prave adrese unutar svoje interne mreze, bez ikakvog hostname/instance-id
# trika koji smo morale rucno da radimo za lokalni razvoj.

services:

  rabbitmq:
    image: rabbitmq:3-management   # ista slika koju smo vec rucno pokrenule ranije
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  config-server:
    build: ./config-server   # "build" znaci: iskoristi Dockerfile IZ TOG foldera
    container_name: config-server
    ports:
      - "8888:8888"

  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    depends_on:
      - config-server   # "cekaj da config-server BAR POKUSA da krene pre mene"
                         # (ne garantuje da je POTPUNO spreman, samo redosled pokretanja)

  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      # "eureka-server" ovde NIJE localhost niti IP adresa - to je IME
      # KONTEJNERA iz ovog istog fajla (vidi "container_name" iznad). Docker
      # ima svoj interni DNS koji ovo ime automatski prevede u pravu adresu.
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      # Umesto "localhost" trika koji smo koristile za lokalni razvoj, ovde
      # servis koristi SVOJE PRAVO ime kontejnera - ostali servisi ga mogu
      # pronaci preko tog imena, bez ikakvih dodatnih podesavanja.
      EUREKA_INSTANCE_HOSTNAME: user-service
    depends_on:
      - eureka-server

  restaurant-service:
    build: ./restaurant-service
    container_name: restaurant-service
    ports:
      - "8082:8082"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      EUREKA_INSTANCE_HOSTNAME: restaurant-service
    depends_on:
      - eureka-server

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "8083:8083"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      EUREKA_INSTANCE_HOSTNAME: order-service
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
    depends_on:
      - eureka-server
      - config-server
      - rabbitmq

  delivery-service:
    build: ./delivery-service
    container_name: delivery-service
    ports:
      - "8084:8084"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      EUREKA_INSTANCE_HOSTNAME: delivery-service
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      - eureka-server
      - rabbitmq

  notification-service:
    build: ./notification-service
    container_name: notification-service
    ports:
      - "8085:8085"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      EUREKA_INSTANCE_HOSTNAME: notification-service
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      - eureka-server
      - rabbitmq

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8090:8090"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      EUREKA_INSTANCE_HOSTNAME: api-gateway
    depends_on:
      - eureka-server
      - user-service
      - restaurant-service
      - order-service
      - delivery-service
      - notification-service
